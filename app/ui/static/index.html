<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>个人知识库智能问答 Agent</title>
<style>
  :root {
    --bg: #0f1115; --bg-soft: #151922; --bg-card: #1b2029; --line: #262c38;
    --text: #e8ecf3; --muted: #8b95a7; --accent: #5b8cff; --accent-soft: #22315a;
    --ok: #35c48a; --warn: #f0b429; --err: #f2545b; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; font-size: 14px; overflow: hidden; }
  button { cursor: pointer; font-family: inherit; font-size: 13px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg-card); color: var(--text); padding: 7px 12px; transition: .15s; }
  button:hover { border-color: var(--accent); color: #fff; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, textarea { font-family: inherit; font-size: 14px; background: var(--bg-soft); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; outline: none; width: 100%; }
  input:focus, textarea:focus { border-color: var(--accent); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #303646; border-radius: 6px; }

  .sidebar { width: 268px; flex: 0 0 268px; background: var(--bg-soft); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; }
  .brand { padding: 16px 16px 10px; font-weight: 700; font-size: 15px; letter-spacing: .3px; }
  .brand small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; margin-top: 3px; }
  .sidebar > .new { margin: 4px 12px 10px; }
  .session-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .session { padding: 9px 10px; border-radius: 9px; margin-bottom: 4px; cursor: pointer;
    display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .session:hover { background: var(--bg-card); }
  .session.active { background: var(--accent-soft); }
  .session .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .session .x { opacity: 0; color: var(--muted); font-size: 15px; line-height: 1; }
  .session:hover .x { opacity: 1; }
  .session .x:hover { color: var(--err); }
  .mini { margin: 0 12px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--bg-card); font-size: 12px; color: var(--muted); line-height: 1.7; }
  .mini b { color: var(--text); }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .tabs { display: flex; align-items: center; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .tabs button.active { background: var(--accent-soft); border-color: var(--accent); color: #fff; }
  .tabs .status { margin-left: auto; color: var(--muted); font-size: 12px; }
  .panel { display: none; flex: 1; overflow-y: auto; padding: 18px 20px; }
  .panel.active { display: flex; flex-direction: column; }

  .messages { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 4px 2px 12px; }
  .empty { margin: auto; text-align: center; color: var(--muted); line-height: 2; }
  .empty h2 { color: var(--text); font-size: 18px; }
  .empty code { background: var(--bg-card); padding: 2px 6px; border-radius: 5px; }
  .msg { display: flex; gap: 10px; }
  .msg.user { flex-direction: row-reverse; }
  .msg .avatar { width: 30px; height: 30px; border-radius: 8px; flex: 0 0 30px; display: flex;
    align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .msg.user .avatar { background: #2b3a5e; color: #b9cdff; }
  .msg.assistant .avatar { background: #1f3d33; color: #8ff0c4; }
  .bubble { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; max-width: 100%; overflow-wrap: anywhere; line-height: 1.75; }
  .msg.user .bubble { background: #1d2431; max-width: min(78%, 640px); border-top-right-radius: 4px; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { margin: 6px 0; padding-left: 20px; } .bubble li { margin: 3px 0; }
  .bubble code { background: #0d1016; padding: 1px 5px; border-radius: 4px; }
  .bubble blockquote { margin: 8px 0; padding: 6px 10px; border-left: 3px solid var(--accent);
    background: #12161f; color: var(--muted); }
  .bubble table { border-collapse: collapse; margin: 8px 0; }
  .bubble th, .bubble td { border: 1px solid var(--line); padding: 5px 9px; }
  .cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .cite { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--accent-soft);
    border: 1px solid #33456f; color: #c3d4ff; cursor: pointer; }
  .cite:hover { background: #2b3f6d; }
  details.chain { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  details.chain summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  details.chain ol { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 12.5px; line-height: 1.85; }
  .think-body { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: var(--bg-soft);
    color: var(--muted); font-size: 12.5px; line-height: 1.75; white-space: pre-wrap;
    max-height: 240px; overflow-y: auto; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 6px; margin-right: 6px; }
  .badge.ok { background: #16382b; color: var(--ok); } .badge.warn { background: #3d3212; color: var(--warn); }
  .badge.err { background: #3d1b1f; color: var(--err); }

  .composer { display: flex; gap: 10px; padding: 10px 0 2px; align-items: flex-end; }
  .composer textarea { resize: none; height: 54px; max-height: 160px; }
  .composer button { flex: 0 0 auto; white-space: nowrap; }
  .typing::after { content: "▌"; animation: blink 1s infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .card .num { font-size: 26px; font-weight: 700; color: var(--accent); }
  .drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 26px; text-align: center;
    color: var(--muted); transition: .15s; margin-bottom: 14px; }
  .drop.over { border-color: var(--accent); background: #16203a; color: var(--text); }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  table.list { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.list th, table.list td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  table.list th { color: var(--muted); font-weight: 500; }
  .bar { height: 7px; background: #222834; border-radius: 999px; overflow: hidden; min-width: 90px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #5b8cff, #35c48a); }
  .muted { color: var(--muted); }
  .modal { position: fixed; inset: 0; background: rgba(4,6,10,.72); display: none; align-items: center;
    justify-content: center; padding: 30px; z-index: 50; }
  .modal.open { display: flex; }
  .modal .box { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px;
    width: min(760px, 100%); max-height: 84vh; overflow-y: auto; padding: 20px; }
  .modal .box h3 { margin: 0 0 6px; }
  .chunk { background: var(--bg-card); border: 1px solid var(--line); border-left: 3px solid transparent;
    border-radius: 9px; padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; line-height: 1.7; }
  .chunk.target { border-left-color: var(--accent); background: #1a2333; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 15px; z-index: 99; box-shadow: 0 8px 26px rgba(0,0,0,.4); }
  .msg-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
    border-top: 1px dashed var(--line); padding-top: 8px; }
  .msg-actions button { font-size: 12px; padding: 3px 9px; color: var(--muted); }
  .msg-actions button:hover { color: #fff; }
  .msg-actions button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .reflect-note { margin-top: 8px; padding: 6px 10px; border-left: 2px solid var(--accent);
    background: var(--accent-soft); border-radius: 6px; font-size: 12.5px; color: #b9cdff; }
  .reflect-badge { margin-top: 8px; font-size: 12.5px; color: var(--accent); }
  .scope-bar { display: flex; align-items: center; gap: 8px; padding-top: 6px; font-size: 12.5px; color: var(--muted); }
  .scope-bar select { width: auto; max-width: 340px; padding: 5px 8px; font-size: 12.5px; }

  /* 窄屏：侧栏移到顶部，避免手机上一半屏幕被会话列表占掉 */
  @media (max-width: 900px) {
    body { flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }
    .sidebar { width: 100%; flex: 0 0 auto; border-right: none; border-bottom: 1px solid var(--line); }
    .session-list { max-height: 150px; }
    .panel { padding: 14px; }
    .msg.user .bubble { max-width: 92%; }
    .tabs { flex-wrap: wrap; }
    .tabs .status { margin-left: 0; width: 100%; }
    .mini { display: none; }
  }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">个人知识库智能问答 Agent<small>只基于你的私有资料作答 · 句句可溯源</small></div>
  <button class="primary new" id="btn-new">＋ 新建会话</button>
  <div class="session-list" id="sessions"></div>
  <div class="mini" id="mini">加载中…</div>
</aside>

<main>
  <div class="tabs">
    <button data-tab="chat" class="active">对话</button>
    <button data-tab="kb">知识库</button>
    <button data-tab="memory">长期记忆</button>
    <button data-tab="stats">统计</button>
    <span class="status" id="status"></span>
  </div>

  <section class="panel active" id="panel-chat">
    <div class="messages" id="messages"></div>
    <div class="scope-bar">
      <span>检索范围</span>
      <select id="scope"><option value="">全部文档</option></select>
    </div>
    <div class="composer">
      <textarea id="input" placeholder="基于你的知识库提问，例如：帮我对比这两份文档的实现方案差异（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="ghost" id="btn-stop" style="display:none">停止</button>
      <button class="primary" id="btn-send">发送</button>
    </div>
  </section>

  <section class="panel" id="panel-kb">
    <div class="drop" id="drop">拖拽文件到这里，或
      <label style="color:var(--accent);cursor:pointer">点击选择文件<input type="file" id="file" multiple hidden /></label>
      <div class="muted" style="margin-top:8px">支持 TXT / Markdown / PDF / Word(.docx) / HTML，可多选批量导入</div>
    </div>
    <div class="row">
      <input id="url" placeholder="或粘贴网页链接，例如 https://example.com/article" style="flex:1;min-width:260px" />
      <button id="btn-url">导入网页</button>
      <button class="ghost" id="btn-refresh-docs">刷新列表</button>
    </div>
    <table class="list">
      <thead><tr><th style="width:32%">文档</th><th>状态</th><th>片段</th><th>大小</th><th>上传时间</th><th style="width:150px">操作</th></tr></thead>
      <tbody id="docs"></tbody>
    </table>
    <h3 style="margin-top:22px;font-size:14px">解析进度</h3>
    <table class="list">
      <thead><tr><th style="width:32%">文件</th><th>阶段</th><th style="width:26%">进度</th><th>说明</th></tr></thead>
      <tbody id="tasks"></tbody>
    </table>
  </section>

  <section class="panel" id="panel-memory">
    <h3 style="margin-top:0;font-size:15px">用户长期记忆 <span class="muted" style="font-weight:400">（自动抽取、自动去重、自动清理）</span></h3>
    <table class="list">
      <thead><tr><th style="width:110px">类型</th><th>内容</th><th style="width:80px">重要度</th><th style="width:90px">操作</th></tr></thead>
      <tbody id="memories"></tbody>
    </table>
  </section>

  <section class="panel" id="panel-stats">
    <div class="grid" id="stat-cards"></div>
    <h3 style="margin:22px 0 10px;font-size:14px">近 7 天问答量</h3>
    <div class="card" id="stat-days"></div>
    <h3 style="margin:22px 0 10px;font-size:14px">问题类型分布</h3>
    <div class="card" id="stat-intents"></div>
  </section>
</main>

<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { sessionId: null, sending: false, docs: [], polling: null, abort: null, documentId: "" };

async function api(path, options = {}) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return response.status === 204 ? null : response.json();
}
function toast(message, ms = 2600) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}
function esc(text) {
  return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function render(text) {
  const lines = esc(text).split("\n");
  let html = "", inList = false, inTable = false;
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  for (const raw of lines) {
    const line = raw.trim();
    if (line.startsWith("|")) {
      const cells = line.split("|").filter((c) => c.trim() !== "").map((c) => inline(c.trim()));
      if (cells.every((c) => /^-+$/.test(c.replace(/<[^>]+>/g, "")))) continue;
      if (!inTable) { html += "<table>"; inTable = true; }
      html += "<tr>" + cells.map((c) => `<td>${c}</td>`).join("") + "</tr>";
      continue;
    } else if (inTable) { html += "</table>"; inTable = false; }
    if (/^[-*]\s+/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inline(line.replace(/^[-*]\s+/, ""))}</li>`;
      continue;
    } else if (inList) { html += "</ul>"; inList = false; }
    if (line.startsWith("&gt;")) { html += `<blockquote>${inline(line.slice(4))}</blockquote>`; continue; }
    if (!line) { continue; }
    html += `<p>${inline(line)}</p>`;
  }
  if (inList) html += "</ul>";
  if (inTable) html += "</table>";
  return html || "<p class='muted'>（空）</p>";
}

/* ---------------- 会话 ---------------- */
async function loadSessions() {
  const data = await api("/api/sessions");
  const box = $("sessions"); box.innerHTML = "";
  if (!data.items.length) { box.innerHTML = "<div class='muted' style='padding:10px;font-size:12.5px'>还没有会话，直接提问即可创建</div>"; return; }
  for (const item of data.items) {
    const el = document.createElement("div");
    el.className = "session" + (item.id === state.sessionId ? " active" : "");
    el.innerHTML = `<span class="t">${esc(item.title)}</span><span class="x" title="删除会话">×</span>`;
    el.onclick = (event) => {
      if (event.target.classList.contains("x")) { removeSession(item.id); return; }
      selectSession(item.id);
    };
    box.appendChild(el);
  }
}
async function selectSession(id) {
  state.sessionId = id;
  await loadSessions();
  const data = await api(`/api/sessions/${id}/messages`);
  const box = $("messages"); box.innerHTML = "";
  for (const message of data.items) addMessage(message.role, message.content, message.citations, message.plan, null);
  if (!data.items.length) renderEmpty();
  box.scrollTop = box.scrollHeight;
}
async function removeSession(id) {
  if (!confirm("确定删除该会话及其全部消息？")) return;
  await api(`/api/sessions/${id}`, { method: "DELETE" });
  if (state.sessionId === id) { state.sessionId = null; $("messages").innerHTML = ""; renderEmpty(); }
  await loadSessions(); toast("会话已删除");
}
function thinkingBlock(text) {
  if (!text) return "";
  return `<details class="chain think"><summary>模型思考过程（${text.length} 字）</summary><div class="think-body">${esc(text)}</div></details>`;
}

function renderEmpty() {
  $("messages").innerHTML = `<div class="empty"><h2>你的私有知识库助理</h2>
    上传资料后直接提问，我会：<br />先规划 → 再检索 → 交叉验证 → 给出带来源的答案<br />
    复杂问题会自动拆解成多个子问题，逐条检索后整合回答。</div>`;
}

/* ---------------- 消息渲染 ---------------- */
function addMessage(role, content, citations, plan, steps) {
  const box = $("messages");
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  wrap.innerHTML = `<div class="avatar">${role === "user" ? "我" : "AI"}</div>
    <div class="bubble"><div class="body">${render(content)}</div><div class="extra"></div></div>`;
  box.appendChild(wrap);
  const extra = wrap.querySelector(".extra");
  if (steps && steps.length) {
    extra.insertAdjacentHTML("beforeend",
      `<details class="chain"><summary>Agent 思考链路（${steps.length} 步）</summary><ol>${
        steps.map((s) => `<li><b>${esc(s.step)}</b>：${esc(s.detail)}</li>`).join("")}</ol></details>`);
  }
  if (citations && citations.length) {
    const chips = citations.map((c) =>
      `<span class="cite" data-doc="${c.document_id}" data-chunk="${c.chunk_id}">[${c.index}]《${esc(c.document_name)}》${
        c.heading ? esc(c.heading.split(" > ").pop()) : ""}</span>`).join("");
    extra.insertAdjacentHTML("beforeend", `<div class="cites">${chips}</div>`);
    extra.querySelectorAll(".cite").forEach((chip) => {
      chip.onclick = () => showCitation(chip.dataset.doc, chip.dataset.chunk);
    });
  }
  box.scrollTop = box.scrollHeight;
  return wrap;
}

async function showCitation(documentId, chunkId) {
  try {
    const data = await api(`/api/documents/${documentId}/chunks/${chunkId}/context?span=2`);
    $("modal-box").innerHTML = `<h3>《${esc(data.document.name)}》</h3>
      <div class="muted" style="font-size:12.5px">原文定位：第 ${data.target.ordinal + 1} 段 ·
      字符区间 ${data.target.start_offset}-${data.target.end_offset}${data.target.heading ? " · " + esc(data.target.heading) : ""}</div>
      ${data.window.map((c) => `<div class="chunk ${c.is_target ? "target" : ""}">${
        c.is_target ? "<b>▶ 命中片段</b>\n" : ""}${esc(c.content)}</div>`).join("")}
      <div class="row" style="margin-top:14px"><button onclick="document.getElementById('modal').classList.remove('open')">关闭</button></div>`;
    $("modal").classList.add("open");
  } catch (error) { toast("溯源失败：" + error.message); }
}

/* ---------------- 提问（流式） ---------------- */
function send() {
  const input = $("input");
  const question = input.value.trim();
  if (!question || state.sending) return;
  input.value = "";
  ask(question);
}

function chatPayload(question) {
  const payload = { question, session_id: state.sessionId };
  if (state.documentId) payload.document_ids = [state.documentId];
  return payload;
}

function setComposerBusy(busy) {
  $("btn-send").disabled = busy;
  $("btn-stop").style.display = busy ? "" : "none";
}

function stopGeneration() {
  if (state.abort) state.abort.abort();
}

async function ask(question) {
  if (!question || state.sending) return;
  state.sending = true;
  state.abort = new AbortController();
  setComposerBusy(true);
  if (!document.querySelector("#messages .msg")) $("messages").innerHTML = "";
  addMessage("user", question);

  const wrap = addMessage("assistant", "");
  wrap.dataset.question = question;
  const body = wrap.querySelector(".body");
  const extra = wrap.querySelector(".extra");
  body.innerHTML = `<span class="typing"></span>`;
  let steps = [], answer = "", citations = [], evidences = [], reflection = null, thinking = "";

  try {
    const response = await fetch("/api/chat/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(chatPayload(question)),
      signal: state.abort.signal,
    });
    if (!response.ok) throw new Error((await response.json()).detail || response.statusText);
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.split("\n").find((l) => l.startsWith("data:"));
        if (!line) continue;
        const event = JSON.parse(line.slice(5).trim());
        if (event.type === "session") { state.sessionId = event.data.session_id; }
        else if (event.type === "steps") { steps = event.data; }
        else if (event.type === "evidences") { evidences = event.data; }
        else if (event.type === "delta") {
          answer += event.data;
          body.innerHTML = render(answer) + `<span class="typing"></span>`;
          $("messages").scrollTop = $("messages").scrollHeight;
        } else if (event.type === "thinking") {
          thinking += event.data;
          extra.innerHTML = thinkingBlock(thinking);
          $("messages").scrollTop = $("messages").scrollHeight;
        } else if (event.type === "final") {
          answer = event.data.answer; citations = event.data.citations; steps = event.data.steps;
          reflection = event.data.reflection || null;
        } else if (event.type === "reflect") {
          const detail = (event.data && event.data.detail) || "正在复核回答是否可信…";
          body.innerHTML = render(answer) + `<div class="reflect-note">🔍 ${esc(detail)}</div><span class="typing"></span>`;
          $("messages").scrollTop = $("messages").scrollHeight;
        } else if (event.type === "error") { throw new Error(event.data); }
      }
    }
  } catch (error) {
    if (error.name === "AbortError") {
      answer = answer || "（已停止生成）";
    } else {
      answer = answer || `⚠️ 请求失败：${error.message}`;
      toast("请求失败：" + error.message);
    }
  }

  body.innerHTML = render(answer);
  extra.innerHTML = "";
  if (thinking) extra.insertAdjacentHTML("beforeend", thinkingBlock(thinking));
  if (steps && steps.length) {
    extra.insertAdjacentHTML("beforeend",
      `<details class="chain"><summary>Agent 思考链路（${steps.length} 步）</summary><ol>${
        steps.map((s) => `<li><b>${esc(s.step)}</b>：${esc(s.detail)}</li>`).join("")}</ol></details>`);
  }
  if (citations && citations.length) {
    extra.insertAdjacentHTML("beforeend", `<div class="cites">${citations.map((c) =>
      `<span class="cite" data-doc="${c.document_id}" data-chunk="${c.chunk_id}">[${c.index}]《${esc(c.document_name)}》${
        c.heading ? esc(c.heading.split(" > ").pop()) : ""}</span>`).join("")}</div>`);
    extra.querySelectorAll(".cite").forEach((chip) => { chip.onclick = () => showCitation(chip.dataset.doc, chip.dataset.chunk); });
  }
  if (reflection && reflection.assessments) {
    extra.insertAdjacentHTML("beforeend",
      `<div class="reflect-badge">🔍 自我反思 ${reflection.assessments} 轮 · 补充检索 ${reflection.rounds || 0} 次 · ${
        reflection.sufficient ? "信息已充足" : "仍有信息缺口"}</div>`);
  }
  wrap.dataset.answer = answer;
  attachActions(wrap);
  state.abort = null;
  state.sending = false;
  setComposerBusy(false);
  $("input").focus();
  await loadSessions(); loadMini(); loadStats();
}

/* ---------------- 知识库 ---------------- */
/* ---------------- 回答操作：复制 / 重新生成 / 反馈 ---------------- */
function attachActions(wrap) {
  const extra = wrap.querySelector(".extra");
  const bar = document.createElement("div");
  bar.className = "msg-actions";
  bar.innerHTML = `
    <button class="ghost" data-act="copy" title="复制这条回答">复制</button>
    <button class="ghost" data-act="regen" title="用同样的问题重新生成">重新生成</button>
    <button class="ghost" data-act="up" title="回答有帮助">👍</button>
    <button class="ghost" data-act="down" title="回答没帮助">👎</button>`;
  bar.querySelector('[data-act="copy"]').onclick = () => copyAnswer(wrap);
  bar.querySelector('[data-act="regen"]').onclick = () => regenerate(wrap);
  bar.querySelector('[data-act="up"]').onclick = (event) => sendFeedback(wrap, "up", event.currentTarget);
  bar.querySelector('[data-act="down"]').onclick = (event) => sendFeedback(wrap, "down", event.currentTarget);
  extra.appendChild(bar);
}

async function copyAnswer(wrap) {
  const text = wrap.dataset.answer || wrap.querySelector(".body").innerText;
  try {
    await navigator.clipboard.writeText(text);
    toast("已复制回答");
  } catch (error) {
    toast("复制失败，请手动选中复制");
  }
}

async function regenerate(wrap) {
  const question = wrap.dataset.question;
  if (!question || state.sending) return;
  wrap.remove();
  await ask(question);
}

async function sendFeedback(wrap, rating, button) {
  if (!state.sessionId) return;
  try {
    await api("/api/chat/feedback", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: state.sessionId, rating }),
    });
    button.closest(".msg-actions").querySelectorAll("button").forEach((item) => item.classList.remove("active"));
    button.classList.add("active");
    toast(rating === "up" ? "感谢反馈～" : "已记录，会继续改进");
  } catch (error) {
    toast("反馈提交失败：" + error.message);
  }
}

/* ---------------- 检索范围 ---------------- */
function renderScope(docs) {
  const select = $("scope");
  if (!select) return;
  const usable = docs.filter((item) => item.chunk_count > 0);
  select.innerHTML = ['<option value="">全部文档</option>']
    .concat(usable.map((item) => `<option value="${item.id}">${esc(item.name)}</option>`))
    .join("");
  if (state.documentId && usable.some((item) => item.id === state.documentId)) {
    select.value = state.documentId;
  } else {
    state.documentId = "";
    select.value = "";
  }
}

async function uploadFiles(files) {
  if (!files.length) return;
  const form = new FormData();
  for (const file of files) form.append("files", file);
  toast(`正在上传 ${files.length} 个文件…`);
  try {
    const data = await api("/api/documents/upload", { method: "POST", body: form });
    for (const item of data.items) toast(`${item.name}：${item.message}`, 3800);
    startPolling();
  } catch (error) { toast("上传失败：" + error.message); }
}
async function loadDocuments() {
  const data = await api("/api/documents");
  state.docs = data.items;
  renderScope(data.items);
  const tbody = $("docs");
  if (!data.items.length) { tbody.innerHTML = "<tr><td colspan='6' class='muted'>知识库还是空的，先上传一份资料吧</td></tr>"; return; }
  tbody.innerHTML = data.items.map((doc) => {
    const status = { indexed: "<span class='badge ok'>已索引</span>", parsing: "<span class='badge warn'>解析中</span>",
      pending: "<span class='badge warn'>排队中</span>", failed: "<span class='badge err'>失败</span>",
      skipped: "<span class='badge warn'>重复跳过</span>" }[doc.status] || `<span class='badge'>${esc(doc.status)}</span>`;
    return `<tr><td title="${esc(doc.error || doc.name)}">${esc(doc.name)}</td><td>${status}</td>
      <td>${doc.chunk_count}</td><td>${(doc.file_size / 1024).toFixed(1)} KB</td>
      <td class="muted">${(doc.created_at || "").replace("T", " ").slice(0, 19)}</td>
      <td><button data-reindex="${doc.id}">重新解析</button> <button class="ghost" data-del="${doc.id}">删除</button></td></tr>`;
  }).join("");
  tbody.querySelectorAll("[data-del]").forEach((btn) => {
    btn.onclick = async () => {
      if (!confirm("删除该文档及其全部片段？")) return;
      await api(`/api/documents/${btn.dataset.del}`, { method: "DELETE" });
      toast("已删除"); loadDocuments(); loadMini(); loadStats();
    };
  });
  tbody.querySelectorAll("[data-reindex]").forEach((btn) => {
    btn.onclick = async () => { await api(`/api/documents/${btn.dataset.reindex}/reindex`, { method: "POST" }); toast("已提交重新解析"); startPolling(); };
  });
}
async function loadTasks() {
  const data = await api("/api/documents/tasks?limit=12");
  const tbody = $("tasks");
  if (!data.items.length) { tbody.innerHTML = "<tr><td colspan='4' class='muted'>暂无解析任务</td></tr>"; return false; }
  let active = false;
  tbody.innerHTML = data.items.map((task) => {
    if (task.status === "running" || task.status === "queued") active = true;
    const color = task.status === "failed" ? "err" : task.status === "succeeded" ? "ok" : "warn";
    return `<tr><td>${esc(task.name)}</td><td><span class="badge ${color}">${esc(task.stage)}</span></td>
      <td><div class="bar"><i style="width:${Math.round(task.progress * 100)}%"></i></div></td>
      <td class="muted">${esc(task.message)}</td></tr>`;
  }).join("");
  return active;
}
function startPolling() {
  if (state.polling) clearInterval(state.polling);
  let ticks = 0;
  state.polling = setInterval(async () => {
    ticks += 1;
    const active = await loadTasks().catch(() => false);
    await loadDocuments().catch(() => {});
    if (!active || ticks > 120) { clearInterval(state.polling); state.polling = null; loadMini(); loadStats(); }
  }, 1000);
  loadTasks();
}
async function ingestUrl() {
  const url = $("url").value.trim();
  if (!url) { toast("请先填写网页链接"); return; }
  try {
    await api("/api/documents/url", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }) });
    $("url").value = ""; toast("已加入抓取队列"); startPolling();
  } catch (error) { toast("导入失败：" + error.message); }
}

/* ---------------- 记忆 / 统计 ---------------- */
async function loadMemories() {
  const data = await api("/api/memories");
  const tbody = $("memories");
  if (!data.items.length) { tbody.innerHTML = "<tr><td colspan='4' class='muted'>还没有长期记忆，Agent 会在对话中自动积累</td></tr>"; return; }
  tbody.innerHTML = data.items.map((item) =>
    `<tr><td><span class="badge">${esc(item.category)}</span></td><td>${esc(item.content)}</td>
     <td>${item.importance.toFixed(2)}</td>
     <td><button class="ghost" data-forget="${item.id}">遗忘</button></td></tr>`).join("");
  tbody.querySelectorAll("[data-forget]").forEach((btn) => {
    btn.onclick = async () => { await api(`/api/memories/${btn.dataset.forget}`, { method: "DELETE" }); loadMemories(); };
  });
}
async function loadStats() {
  const data = await api("/api/stats");
  $("stat-cards").innerHTML = [
    ["文档总数", data.documents], ["知识片段", data.chunks], ["问答次数", data.qa_count],
    ["会话数", data.sessions], ["长期记忆", data.memories], ["平均响应(ms)", data.average_latency_ms],
  ].map(([label, value]) => `<div class="card"><h3>${label}</h3><div class="num">${value ?? 0}</div></div>`).join("");
  const max = Math.max(1, ...data.qa_recent_days.map((d) => d.total));
  $("stat-days").innerHTML = data.qa_recent_days.length
    ? data.qa_recent_days.map((d) => `<div class="row" style="margin-bottom:8px"><span class="muted" style="width:96px">${d.date}</span>
        <div class="bar" style="flex:1"><i style="width:${(d.total / max) * 100}%"></i></div><span>${d.total}</span></div>`).join("")
    : "<div class='muted'>最近 7 天还没有问答记录</div>";
  $("stat-intents").innerHTML = data.intent_distribution.length
    ? data.intent_distribution.map((d) => `<span class="cite" style="cursor:default">${esc(d.intent)} · ${d.total}</span>`).join(" ")
    : "<div class='muted'>暂无数据</div>";
}
async function loadMini() {
  try {
    const data = await api("/api/stats");
    $("mini").innerHTML = `文档 <b>${data.documents}</b> · 片段 <b>${data.chunks}</b><br />
      问答 <b>${data.qa_count}</b> 次 · 记忆 <b>${data.memories}</b> 条`;
  } catch (error) { $("mini").textContent = "统计不可用"; }
}
async function loadHealth() {
  try {
    const data = await api("/api/health");
    const c = data.config;
    $("status").textContent = `LLM: ${c.llm_provider} · 向量: ${c.embedding_provider} · 向量库: ${c.vector_backend}`;
    if (c.llm_provider === "mock") {
      $("status").innerHTML += ` <span class="badge warn" title="未配置 LLM_API_KEY，当前使用离线抽取式回答">离线模式</span>`;
    }
  } catch (error) { $("status").textContent = "服务未就绪"; }
}

/* ---------------- 事件绑定 ---------------- */
document.querySelectorAll(".tabs button").forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
    btn.classList.add("active");
    $("panel-" + btn.dataset.tab).classList.add("active");
    if (btn.dataset.tab === "kb") { loadDocuments(); loadTasks(); }
    if (btn.dataset.tab === "memory") loadMemories();
    if (btn.dataset.tab === "stats") loadStats();
  };
});
$("btn-send").onclick = send;
$("btn-stop").onclick = stopGeneration;
$("scope").addEventListener("change", (event) => { state.documentId = event.target.value; });
$("input").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); send(); }
});
$("btn-new").onclick = async () => {
  const session = await api("/api/sessions", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  state.sessionId = session.id; $("messages").innerHTML = ""; renderEmpty(); loadSessions();
};
$("btn-url").onclick = ingestUrl;
$("btn-refresh-docs").onclick = () => { loadDocuments(); loadTasks(); };
$("file").addEventListener("change", (event) => uploadFiles(event.target.files));
$("drop").addEventListener("dragover", (event) => { event.preventDefault(); $("drop").classList.add("over"); });
$("drop").addEventListener("dragleave", () => $("drop").classList.remove("over"));
$("drop").addEventListener("drop", (event) => {
  event.preventDefault(); $("drop").classList.remove("over"); uploadFiles(event.dataTransfer.files);
});
$("modal").onclick = (event) => { if (event.target.id === "modal") $("modal").classList.remove("open"); };

renderEmpty();
loadSessions(); loadHealth(); loadMini(); loadStats(); loadDocuments(); loadTasks();
</script>
</body>
</html>
